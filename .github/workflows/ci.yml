name: check

# 与 acceptance/check.sh 严格是同一道门槛，五关依次是：
#   0/5 版本一致性 → 1/5 fmt → 2/5 clippy（警告即失败）→ 3/5 全量测试 → 4/5 界面布局自检。
# 这里不重抄任何一步 —— CI 与本地跑的必须是同一个脚本，否则"本机能过 CI 不能过"
# 就会变成常态。本机跑是 --offline（依赖已缓存），CI 上没有缓存，所以用
# CARGO_FLAGS="" 让它联网解析。
# 依赖里带 ffmpeg 的那几个用例（12 个：export_video 7 / queue_export 3 / retime_export 1 /
# export_stills 1）现在**没有 ffmpeg 就红**，所以下面装了 ffmpeg。以前它们是「找不到就跳过」，
# 于是 CI 常年全绿而一个都没执行 —— 1.2.0 修掉的那个「AVIF 导出从上线起就是坏的」bug，
# 就是这么藏了一整轮。本机没 ffmpeg 又想跳过，显式设 AEVUM_ALLOW_NO_FFMPEG=1。
#
# 为什么没有 MSRV job：`rust-version = "1.88"` 是对下游的**声明**（界面代码用了 1.88 起、
# 仅 2024 edition 可用的 let-chain），而本仓构建只用 rust-toolchain.toml 里的 1.98.0。
# 真跑一个 1.88 job 能提前抓出「不小心用了 1.89+ 语法」，代价是每次 CI 多装一套 toolchain、
# 多编一遍全 workspace。当前的约束是「不用更新语法」的纪律 + Cargo.toml 里的声明 ——
# 这**不等于**已在 1.88 上验证过：本机是 1.98，编得过说明不了 MSRV 成立。
# 以后若要加，加一个只跑 `cargo check --workspace` 的独立 job，别塞进这道门槛 ——
# 门槛红了必须是代码问题，不能是工具链问题。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    env:
      CARGO_FLAGS: ""
    steps:
      - uses: actions/checkout@v4

      # 工具链版本只写在仓库根的 rust-toolchain.toml 里，这里不再手抄一遍 ——
      # 两处写同一个版本号，迟早只改一处。`rustup show` 会读到那个文件，缺什么装
      # 什么，已装则不动。下面四行是**验证**：版本没对上就在这一步红，而不是等到
      # `cargo fmt --check` 报一堆看不出原因的格式错。
      - name: toolchain
        shell: bash
        run: |
          rustup show
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # 导出类用例的硬依赖。装了它，「全绿」才等于「那 12 个用例真跑过」。
      # 镜像里通常已经带一份（choco），有就不动；没有才装。
      - name: ffmpeg
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "already present"
          else
            choco install -y ffmpeg --no-progress
          fi
          ffmpeg -hide_banner -version | head -n 3

      - name: gate
        shell: bash
        run: bash acceptance/check.sh
