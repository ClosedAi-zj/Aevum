name: check

# 与 scripts/check.sh 同一道门槛：格式 → clippy（警告即失败）→ 全量测试 → 布局自检。
# 本机跑是 --offline（依赖已缓存），CI 上没有缓存，所以用 CARGO_FLAGS="" 让它联网解析。
# 依赖里带 ffmpeg 的那几个用例会在找不到可执行文件时自己跳过，CI 不装 ffmpeg 也算全绿。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    env:
      CARGO_FLAGS: ""
    steps:
      - uses: actions/checkout@v4

      # windows-latest 镜像自带 stable 工具链；这里只打印版本，不额外装。
      # 版本下限由 Cargo.toml 的 rust-version = "1.88" 声明（界面用了 let-chain）。
      - name: toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: gate
        shell: bash
        run: bash scripts/check.sh
