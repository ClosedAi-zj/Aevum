name: check

# 与 acceptance/check.sh 同一道门槛：格式 → clippy（警告即失败）→ 全量测试 → 布局自检。
# 本机跑是 --offline（依赖已缓存），CI 上没有缓存，所以用 CARGO_FLAGS="" 让它联网解析。
# 依赖里带 ffmpeg 的那几个用例会在找不到可执行文件时自己跳过，CI 不装 ffmpeg 也算全绿。
#
# 为什么没有 MSRV job：`rust-version = "1.88"` 是对下游的**声明**（界面代码用了 1.88 起、
# 仅 2024 edition 可用的 let-chain），而本仓构建只用 rust-toolchain.toml 里的 1.98.0。
# 真跑一个 1.88 job 能提前抓出「不小心用了 1.89+ 语法」，代价是每次 CI 多装一套 toolchain、
# 多编一遍全 workspace。当前的约束是「不用更新语法」的纪律 + Cargo.toml 里的声明 ——
# 这**不等于**已在 1.88 上验证过：本机是 1.98，编得过说明不了 MSRV 成立。
# 以后若要加，加一个只跑 `cargo check --workspace` 的独立 job，别塞进这道门槛 ——
# 门槛红了必须是代码问题，不能是工具链问题。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    env:
      CARGO_FLAGS: ""
    steps:
      - uses: actions/checkout@v4

      # 工具链版本只写在仓库根的 rust-toolchain.toml 里，这里不再手抄一遍 ——
      # 两处写同一个版本号，迟早只改一处。`rustup show` 会读到那个文件，缺什么装
      # 什么，已装则不动。下面四行是**验证**：版本没对上就在这一步红，而不是等到
      # `cargo fmt --check` 报一堆看不出原因的格式错。
      - name: toolchain
        shell: bash
        run: |
          rustup show
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: gate
        shell: bash
        run: bash acceptance/check.sh
