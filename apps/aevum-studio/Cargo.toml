# 包名跟目录一致，产物叫 aevum.exe。
[[bin]]
name = "aevum"
path = "src/main.rs"

[dependencies]
aevum-core.workspace = true
aevum-ui.workspace = true
aevum-mcp.workspace = true
eframe.workspace = true
# 只用来把 assets/app.png 解成窗口图标；工作区里已在编，离线可用。
image.workspace = true
