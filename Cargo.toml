[workspace]
resolver = "3"
members = [
    "crates/aevum-core",
    "crates/aevum-ui",
    "crates/aevum-mcp",
    "apps/aevum-studio",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.88"  # 界面代码用了 let-chain（1.88 起、仅 2024 edition 可用）
license = "MIT"
authors = ["Aevum Studio contributors"]

[workspace.dependencies]
aevum-core = { path = "crates/aevum-core" }
aevum-ui = { path = "crates/aevum-ui" }
aevum-mcp = { path = "crates/aevum-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件清单是给第三方作者手写的：要注释、要能分节。JSON 的插件清单最后都会
# 变成一个几百行、没法写一句说明的大括号。
toml = "0.9"
rayon = "1.12"
thiserror = "2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
] }
rfd = "0.17"
# 字形轮廓：水印的文字层自己栅格化，不引第二个字体栈（界面那套字体走 epaint，
# 两边都读 assets/fonts 里的同一份字节）。版本钉在 egui 已带进锁文件的那个上。
skrifa = "0.44"
# RAW 第三方解码后端（CRX/12/14 位打包）：纯 Rust、MIT OR Apache-2.0，
# 见 crates/aevum-core/Cargo.toml 的 raw-rawler feature 与 docs/依赖许可说明.md。
# 0.8 起要求 rustc 1.89，高于本仓 MSRV 1.88，钉在 0.7.x。
rawler = "=0.7.2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
# 调试信息只保留行表（文件名 + 行号），不写变量与类型。
#
# 为什么不取默认的 2：MSVC 后端把调试信息单独写进 .pdb，而测试二进制把
# image / rawler / skrifa / egui 全静态链接进来，**单个 pdb 就到 300 MB**。
# 2026-11-01 实测：43 个测试目标 × 各自一份 300 MB pdb，光 .pdb 就 28.9 GB，
# 整个 target 46 GB、E 盘被压到 36 GB 可用。取 1 之后同一份代码的 pdb 降到
# 个位数 MB（对照 release 无调试信息时是 4.5 MB）。
#
# 代价只有一个：断点里看不到局部变量，只能靠 println 或临时调回 2。回栈仍然
# 有完整的文件名与行号，panic 定位不受影响；需要逐帧看变量时，临时改这一行为
# 2 再编，不要长期留在仓库里（那是把一个会话的便利摊到所有人的磁盘上）。
debug = 1

[profile.dev.package."*"]
opt-level = 3
