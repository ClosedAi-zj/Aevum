[package]
name = "aevum-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aevum-core.workspace = true
egui.workspace = true
eframe.workspace = true
image.workspace = true
rfd.workspace = true
# 回环控制与 AI 面板的 JSON-RPC / control.json；工作区里已在编，离线可用。
serde.workspace = true
serde_json.workspace = true
# 胶片条批量解码；用独立线程池，不和预览渲染抢核。
rayon.workspace = true
# 取 winit 窗口的原生句柄，把外观圆角落到 Windows 的窗口边界上。
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
# 无边框窗口顶部那条 1px 白线是 DWM 投影的上边缘，只能从 winit 层关掉
# （`WindowExtWindows::set_undecorated_shadow`）。Linux/macOS 不引这一条。
#
# The 1 px line on top of the borderless window is the DWM shadow's top edge and can
# only be turned off through winit (`WindowExtWindows::set_undecorated_shadow`).
winit.workspace = true

[dev-dependencies]
# 字体判据要读 `OS/2.usWeightClass` 与 cmap：这两个值没有别的来源，只能解析字体。
# skrifa 已经在工作区锁文件里（epaint 带的），不新增任何下载。
#
# The font judges need `OS/2.usWeightClass` and the cmap, which only a font parser can
# read. skrifa is already in the workspace lock file (pulled in by epaint), so this
# adds no downloads.
skrifa.workspace = true

[lints.clippy]
# `as_chunks::<N>().0` 与 `chunks_exact(N)` 生成的迭代一样，但多一层 `.0` 投影；
# 三步一组的像素循环里保留 `chunks_exact`。整个工作区统一这一种写法。
chunks_exact_to_as_chunks = "allow"
